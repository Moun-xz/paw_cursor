    <text x="16" y="26" font-size="11" font-weight="500" fill="#C4B49C">06</text>
    <polygon points="100,44 109,58 91,58" fill="#8B5A3C" stroke="#1A1410" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="100,136 91,122 109,122" fill="#8B5A3C" stroke="#1A1410" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="58,90 72,81 72,99" fill="#8B5A3C" stroke="#1A1410" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="142,90 128,81 128,99" fill="#8B5A3C" stroke="#1A1410" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="100" y1="58" x2="100" y2="80" stroke="#A67250" stroke-width="3"/>
    <line x1="100" y1="100" x2="100" y2="122" stroke="#A67250" stroke-width="3"/>
    <line x1="72" y1="90" x2="84" y2="90" stroke="#A67250" stroke-width="3"/>
