  <!-- 10 不可用 -->
  <g transform="translate(22,718)">
    <rect width="200" height="200" rx="14" fill="#FAF6F0" stroke="#E8DFD2" stroke-width="1.5"/>
    <text x="16" y="26" font-size="11" font-weight="500" fill="#C4B49C">10</text>
    <circle cx="100" cy="90" r="32" fill="none" stroke="#8B5A3C" stroke-width="5"/>
    <use xlink:href="#paw" href="#paw" transform="translate(100,90) scale(0.9)"/>
    <line x1="77" y1="67" x2="123" y2="113" stroke="#8B5A3C" stroke-width="5" stroke-linecap="round"/>
    <text x="100" y="180" text-anchor="middle" font-size="12" font-weight="500" fill="#6B5D4F">不可用</text>
  </g>

  <!-- 11 帮助选择 -->
