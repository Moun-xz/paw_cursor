    <text x="16" y="26" font-size="11" font-weight="500" fill="#C4B49C">03</text>
    <rect x="66" y="56" width="68" height="8" rx="2.5" fill="#8B5A3C" stroke="#1A1410" stroke-width="1.5"/>
    <rect x="96" y="64" width="8" height="48" fill="#8B5A3C" stroke="#1A1410" stroke-width="1.5"/>
    <rect x="66" y="112" width="68" height="8" rx="2.5" fill="#8B5A3C" stroke="#1A1410" stroke-width="1.5"/>
    <use xlink:href="#paw" href="#paw" transform="translate(100,47) scale(0.55)"/>
    <text x="100" y="180" text-anchor="middle" font-size="12" font-weight="500" fill="#6B5D4F">文本选择</text>
  </g>

