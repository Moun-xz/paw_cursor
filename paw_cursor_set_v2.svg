    <text x="100" y="180" text-anchor="middle" font-size="12" font-weight="500" fill="#6B5D4F">帮助选择</text>
  </g>

  <!-- 12 精确选择 -->
  <g transform="translate(454,718)">
    <rect width="200" height="200" rx="14" fill="#FAF6F0" stroke="#E8DFD2" stroke-width="1.5"/>
    <text x="16" y="26" font-size="11" font-weight="500" fill="#C4B49C">12</text>
