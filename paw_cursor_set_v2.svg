  </g>

  <!-- 08 垂直调整 -->
  <g transform="translate(238,502)">
    <rect width="200" height="200" rx="14" fill="#FAF6F0" stroke="#E8DFD2" stroke-width="1.5"/>
    <text x="16" y="26" font-size="11" font-weight="500" fill="#C4B49C">08</text>
    <line x1="100" y1="52" x2="100" y2="128" stroke="#8B5A3C" stroke-width="5" stroke-linecap="round"/>
    <polygon points="100,38 91,52 109,52" fill="#8B5A3C" stroke="#1A1410" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="100,142 91,128 109,128" fill="#8B5A3C" stroke="#1A1410" stroke-width="1.5" stroke-linejoin="round"/>
    <use xlink:href="#paw" href="#paw" transform="translate(100,90) scale(0.7)"/>
    <text x="100" y="180" text-anchor="middle" font-size="12" font-weight="500" fill="#6B5D4F">垂直调整</text>
