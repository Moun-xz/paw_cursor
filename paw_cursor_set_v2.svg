    <line x1="56" y1="90" x2="86" y2="90" stroke="#8B5A3C" stroke-width="5" stroke-linecap="round"/>
    <line x1="114" y1="90" x2="144" y2="90" stroke="#8B5A3C" stroke-width="5" stroke-linecap="round"/>
    <line x1="100" y1="46" x2="100" y2="76" stroke="#8B5A3C" stroke-width="5" stroke-linecap="round"/>
    <line x1="100" y1="104" x2="100" y2="134" stroke="#8B5A3C" stroke-width="5" stroke-linecap="round"/>
