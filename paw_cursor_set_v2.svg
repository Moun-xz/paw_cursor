    <rect width="200" height="200" rx="14" fill="#FAF6F0" stroke="#E8DFD2" stroke-width="1.5"/>
    <text x="16" y="26" font-size="11" font-weight="500" fill="#C4B49C">11</text>
    <ellipse cx="98" cy="114" rx="26" ry="6" fill="#5C3B23" opacity="0.1"/>
    <use xlink:href="#paw" href="#paw" transform="translate(94,96) scale(1.05)"/>
    <circle cx="128" cy="58" r="16" fill="#D4B58E" stroke="#1A1410" stroke-width="2"/>
