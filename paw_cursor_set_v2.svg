    <line x1="60" y1="124" x2="140" y2="44" stroke="#8B5A3C" stroke-width="5" stroke-linecap="round"/>
    <polygon points="148,36 133,41 143,51" fill="#8B5A3C" stroke="#1A1410" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="52,132 57,117 67,127" fill="#8B5A3C" stroke="#1A1410" stroke-width="1.5" stroke-linejoin="round"/>
    <use xlink:href="#paw" href="#paw" transform="translate(100,84) rotate(-45) scale(0.68)"/>
    <text x="100" y="180" text-anchor="middle" font-size="12" font-weight="500" fill="#6B5D4F">对角调整</text>
