    <path d="M 100,58 A 32,32 0 0 1 132,90" fill="none" stroke="#A67250" stroke-width="4.5" stroke-linecap="round"/>
    <polygon points="126,88 138,88 132,100" fill="#A67250" stroke="#1A1410" stroke-width="1.2" stroke-linejoin="round"/>
