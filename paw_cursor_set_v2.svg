<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 680 940" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <g id="paw">
      <ellipse cx="-9" cy="-6" rx="2.5" ry="3.5" fill="#A67250" stroke="#1A1410" stroke-width="1" transform="rotate(-22 -9 -6)"/>
      <ellipse cx="-3.5" cy="-9" rx="2.5" ry="3.5" fill="#A67250" stroke="#1A1410" stroke-width="1" transform="rotate(-8 -3.5 -9)"/>
      <ellipse cx="3.5" cy="-9" rx="2.5" ry="3.5" fill="#A67250" stroke="#1A1410" stroke-width="1" transform="rotate(8 3.5 -9)"/>
      <ellipse cx="9" cy="-6" rx="2.5" ry="3.5" fill="#A67250" stroke="#1A1410" stroke-width="1" transform="rotate(22 9 -6)"/>
      <path d="M 0,7 C -9,7 -11,2 -8,-2 C -5,-5 -2,-4 0,-1 C 2,-4 5,-5 8,-2 C 11,2 9,7 0,7 Z" fill="#8B5A3C" stroke="#1A1410" stroke-width="1.3"/>
      <circle cx="-2.5" cy="2.5" r="1.2" fill="#D4B58E"/>
      <circle cx="-8" cy="-4.5" r="0.8" fill="#D4B58E"/>
      <circle cx="8" cy="-4.5" r="0.8" fill="#D4B58E"/>
    </g>
  </defs>

  <rect x="0" y="0" width="680" height="940" fill="#FBF8F3"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="500" fill="#3B2E22">狗爪子鼠标指针套装 · V2 暖棕版</text>
  <text x="340" y="54" text-anchor="middle" font-size="12" fill="#8A7A66">12 款状态 · 已更新默认箭头与链接手型的爪印位置</text>

  <!-- 01 默认选择：爪印放大至 0.8 倍，旋转 -42° 对齐箭头方向，居中于箭头身部 -->
  <g transform="translate(22,70)">
    <rect width="200" height="200" rx="14" fill="#FAF6F0" stroke="#E8DFD2" stroke-width="1.5"/>
    <text x="16" y="26" font-size="11" font-weight="500" fill="#C4B49C">01</text>
    <ellipse cx="104" cy="112" rx="28" ry="7" fill="#5C3B23" opacity="0.12"/>
    <path d="M 85,63 L 85,108 L 96,98.5 L 102.5,113 L 110,109 L 103.5,95 L 115,94 Z" fill="#F0E4D3" stroke="#1A1410" stroke-width="2.5" stroke-linejoin="round"/>
    <use xlink:href="#paw" href="#paw" transform="translate(98,84) rotate(-42) scale(0.8)"/>
    <text x="100" y="180" text-anchor="middle" font-size="12" font-weight="500" fill="#6B5D4F">默认选择</text>
  </g>

  <!-- 02 链接选择：指尖只留心形肉垫作按压触点，完整爪印居中于掌心 -->
  <g transform="translate(238,70)">
    <rect width="200" height="200" rx="14" fill="#FAF6F0" stroke="#E8DFD2" stroke-width="1.5"/>
    <text x="16" y="26" font-size="11" font-weight="500" fill="#C4B49C">02</text>
    <ellipse cx="100" cy="134" rx="30" ry="6" fill="#5C3B23" opacity="0.12"/>
    <path d="M 88,86 L 88,56 C 88,50 91,47 96,47 C 101,47 104,50 104,56 L 104,82 L 110,82 C 112,78 118,77 121,81 C 123,83 124,86 124,89 L 124,110 C 124,122 115,128 104,128 L 92,128 C 81,128 74,121 74,110 L 74,94 C 74,90 77,86 82,86 Z" fill="#F0E4D3" stroke="#1A1410" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 0,7 C -9,7 -11,2 -8,-2 C -5,-5 -2,-4 0,-1 C 2,-4 5,-5 8,-2 C 11,2 9,7 0,7 Z" transform="translate(96,60) scale(0.8)" fill="#8B5A3C" stroke="#1A1410" stroke-width="1.3"/>
    <use xlink:href="#paw" href="#paw" transform="translate(99,103) scale(0.85)"/>
    <text x="100" y="180" text-anchor="middle" font-size="12" font-weight="500" fill="#6B5D4F">链接选择</text>
  </g>

